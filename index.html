<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1b2a">
    <title>车上点名</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">本地离线点名</p>
          <h1>车上点名</h1>
        </div>
        <button class="ghost-button" id="installButton" hidden>安装</button>
      </header>

      <main>
        <section class="setup-panel" id="setupPanel">
          <div class="panel-heading">
            <h2>导入名单</h2>
            <p>支持 Excel 文件，或从在线表格复制后粘贴。数据只保存在这台手机里。</p>
          </div>

          <div class="import-grid">
            <label class="file-drop" for="excelInput">
              <span class="file-icon">+</span>
              <span>
                <strong>选择 Excel</strong>
                <small>.xlsx / .xls / .csv</small>
              </span>
            </label>
            <input id="excelInput" type="file" accept=".xlsx,.xls,.csv,.ods" hidden>

            <div class="paste-box">
              <label for="pasteInput">粘贴在线表格内容</label>
              <textarea id="pasteInput" rows="6" placeholder="从表格中选中姓名、手机号、身份证号几列，复制后粘贴到这里"></textarea>
              <button class="secondary-button" id="parsePasteButton">解析粘贴内容</button>
            </div>
          </div>
        </section>

        <section class="mapping-panel" id="mappingPanel" hidden>
          <div class="panel-heading">
            <h2>确认字段</h2>
            <p>确认哪几列分别是姓名、手机号、身份证号。身份证只会显示后四位。</p>
          </div>

          <label class="check-row">
            <input type="checkbox" id="hasHeaderCheckbox" checked>
            <span>第一行是表头</span>
          </label>

          <div class="mapping-grid">
            <label>
              姓名
              <select id="nameColumn"></select>
            </label>
            <label>
              手机号
              <select id="phoneColumn"></select>
            </label>
            <label>
              身份证号
              <select id="idColumn"></select>
            </label>
          </div>

          <div class="preview-wrap">
            <table id="previewTable">
              <thead>
                <tr>
                  <th>姓名</th>
                  <th>手机号</th>
                  <th>身份证后四位</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

          <div class="action-row">
            <button class="secondary-button" id="cancelImportButton">重新导入</button>
            <button class="primary-button" id="confirmImportButton">使用这份名单</button>
          </div>
        </section>

        <section class="rollcall-panel" id="rollcallPanel" hidden>
          <div class="toolbar">
            <div>
              <input id="groupTitle" class="title-input" maxlength="40" aria-label="团名" placeholder="本次团名">
              <p class="save-state" id="saveState">已保存在本机</p>
            </div>
            <button class="danger-button" id="clearRoundButton">清空本轮</button>
          </div>

          <div class="stats" id="stats"></div>

          <div class="controls">
            <input id="searchInput" class="search-input" placeholder="搜索姓名或手机号" autocomplete="off">
            <div class="segmented" role="tablist" aria-label="筛选">
              <button data-filter="all" class="active">全部</button>
              <button data-filter="pending">未点</button>
              <button data-filter="absent">未到</button>
              <button data-filter="arrived">已到</button>
            </div>
          </div>

          <div class="quick-actions">
            <button class="secondary-button" id="markVisibleArrivedButton">当前列表全设已到</button>
            <button class="secondary-button" id="showImportButton">换名单</button>
          </div>

          <div class="people-list" id="peopleList"></div>
          <p class="empty-state" id="emptyState" hidden>没有匹配的人员</p>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="vendor/xlsx.full.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
